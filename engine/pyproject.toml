[project]
name = "cadre-engine"
version = "1.0.0"
description = "Cadre engine: media, transcription, AI, rendering."
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "anthropic>=1.0",
  "numpy>=2.0",
  "scipy>=1.13",
  "pillow>=10.0",
  "yt-dlp>=2025.1.1",
  "static-ffmpeg>=2.7",
  "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "faster-whisper>=1.1; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[project.optional-dependencies]
# voice recognition (who is speaking) and voice / game audio separation: ~2 GB, installed on demand
# (the extra keeps its name 'voix': the engine installs it with `uv sync --extra voix`)
voix = ["torch>=2.4", "torchaudio>=2.4", "speechbrain>=1.0", "demucs>=4.0", "soundfile>=0.12"]

[tool.uv]
package = false
