# Fabrique les installateurs à chaque étiquette « v* » (ex. git tag v1.0.0 && git push --tags) et les publie dans une
# Release GitHub : Cadre-mac-apple-silicon.dmg, Cadre-mac-intel.dmg, Cadre-Setup-x64.exe.
# Signature et notarisation : facultatives, activées si les secrets existent (voir README › Distribution).
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, script: 'dist:mac' }
          - { os: macos-13, script: 'dist:mac-intel' }
          - { os: windows-latest, script: 'dist:win' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: astral-sh/setup-uv@v6
      - name: Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress
      - name: Certificat Apple (facultatif)
        if: runner.os == 'macOS' && env.MAC_CERT != ''
        env:
          MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          echo "$MAC_CERT" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain && security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - run: pnpm ${{ matrix.script }}
        working-directory: desktop
        env:
          CADRE_SIGN_ID: ${{ secrets.MAC_SIGN_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.zip
